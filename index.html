<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerala Era">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kerala Era ’27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header + scrolling tab pills, one view at a time, floating add button. */
:root{
  --bg:#EDF4F0; --surface:#FFFFFF; --surface-2:#E1ECE6; --ink:#0F231E; --muted:#566B64; --line:#CFDFD7;
  --accent:#0E8A62; --accent-ink:#FFFFFF; --pop:#F2542D; --sun:#FFBF2E; --lagoon:#1599A8; --hibiscus:#D8326B;
  --hero:#0F3D32; --hero-ink:#F2FFF8; --hero-muted:#A9D3C3; --scrim:rgba(8,20,16,.55);
  --ok:#1E8F55; --warn:#C27A00; --bad:#C23A2B;
  --t-mountain:linear-gradient(150deg,#1B6B4A,#0E3B2E 70%);
  --t-trek:linear-gradient(150deg,#3E7C3A,#173A22 70%);
  --t-beach:linear-gradient(160deg,#FF8A4C,#F2542D 45%,#1599A8 100%);
  --t-temple:linear-gradient(150deg,#F2A516,#B5530E 75%);
  --t-safari:linear-gradient(150deg,#7C8A2B,#2F3B10 75%);
  --t-house:linear-gradient(150deg,#19B3C2,#0B5866 75%);
  --t-wild:linear-gradient(150deg,#2F6B3F,#11281A 75%);
  --t-gem:linear-gradient(150deg,#E8457C,#7B1840 80%);
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08130F; --surface:#10201B; --surface-2:#172C25; --ink:#E6F2EC; --muted:#93AAA1; --line:#24403A;
  --accent:#2FC98D; --accent-ink:#04140D; --pop:#FF7454; --sun:#FFCE55; --lagoon:#3CC6D4; --hibiscus:#F2628F;
  --hero:#123F33; --hero-ink:#EFFFF7; --hero-muted:#9CCDB9; --scrim:rgba(0,0,0,.66);
  --ok:#3CCB7F; --warn:#F0B13B; --bad:#FF6B5A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#08130F; --surface:#10201B; --surface-2:#172C25; --ink:#E6F2EC; --muted:#93AAA1; --line:#24403A;
  --accent:#2FC98D; --accent-ink:#04140D; --pop:#FF7454; --sun:#FFCE55; --lagoon:#3CC6D4; --hibiscus:#F2628F;
  --hero:#123F33; --hero-ink:#EFFFF7; --hero-muted:#9CCDB9; --scrim:rgba(0,0,0,.66);
  --ok:#3CCB7F; --warn:#F0B13B; --bad:#FF6B5A; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
img{max-width:100%; display:block}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.02em}
h2{font-size:1.35rem; font-weight:800}
h3{font-size:1.05rem; font-weight:800}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px; margin:0 auto; padding-left:var(--gut-l); padding-right:var(--gut-r)}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.top-row{display:flex; align-items:center; gap:10px; padding-block:10px 6px}
.logo{width:38px; height:38px; border-radius:12px; background:var(--hero); color:var(--sun); display:grid; place-items:center; font:800 13px/1 var(--f-display); flex:none; transform:rotate(-4deg)}
.brand{min-width:0; flex:1}
.brand b{display:block; font:800 1.05rem/1.15 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sync{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.dot.live{background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent)}
.dot.wait{background:var(--warn)}
.dot.err{background:var(--bad)}
.icon-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.icon-btn svg{width:20px; height:20px}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-block:4px 10px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:700; font-size:14px; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

main{padding-block:18px 24px}
.view{display:grid; gap:22px}
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.sec-head p{margin:2px 0 0; color:var(--muted)}

/* generic */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px}
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr))}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:700; background:var(--surface-2); color:var(--ink); border:1px solid transparent; white-space:nowrap}
button.chip{border-color:var(--line); background:var(--surface)}
button.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pill{display:inline-block; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:800; letter-spacing:.02em}
.st-idea,.st-shortlist,.st-estimate,.st-skip,.st-not-now,.st-rejected{background:var(--surface-2); color:var(--muted)}
.st-shortlisted,.st-to-book,.st-contacted,.st-quoted{background:color-mix(in srgb, var(--sun) 30%, var(--surface)); color:var(--ink)}
.st-booked{background:color-mix(in srgb, var(--accent) 22%, var(--surface)); color:var(--ink)}
.st-paid{background:var(--accent); color:var(--accent-ink)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:14px; padding:11px 16px; font-weight:800; border:1px solid var(--line); background:var(--surface); text-decoration:none; font-size:14px}
.btn svg{width:17px; height:17px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.dark{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
.btn.danger.armed{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn.sm{padding:7px 11px; font-size:13px; border-radius:11px}
.link-out{display:inline-flex; align-items:center; gap:4px; font-weight:700; color:var(--accent); text-decoration:none; font-size:13.5px}
.link-out svg{width:14px; height:14px}
.by{font-size:11.5px; color:var(--muted)}
.empty{border:2px dashed var(--line); border-radius:var(--r-lg); padding:22px; text-align:center; color:var(--muted)}

/* hero */
.hero{background:var(--hero); color:var(--hero-ink); border-radius:28px; padding:22px 20px; display:grid; gap:18px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--sun) 55%, transparent), transparent 70%); opacity:.55; pointer-events:none}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-weight:800; color:var(--hero-muted)}
.hero h1{font-size:clamp(2rem, 8vw, 3.4rem); font-weight:800; line-height:.98; margin-top:6px}
.route-line{margin:8px 0 0; color:var(--hero-muted); font-weight:600}
.count{display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1}
.count div{background:color-mix(in srgb, var(--hero-ink) 9%, transparent); border:1px solid color-mix(in srgb, var(--hero-ink) 16%, transparent); border-radius:16px; padding:10px 14px; min-width:78px}
.count b{display:block; font:700 1.9rem/1 var(--f-mono); color:var(--sun)}
.count span{font-size:12px; color:var(--hero-muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.hero .chip{background:color-mix(in srgb, var(--hero-ink) 12%, transparent); color:var(--hero-ink)}
.stats{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 155px), 1fr))}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; display:grid; gap:4px; text-align:left}
.stat .k{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.stat .v{font:800 1.5rem/1.1 var(--f-display)}
.bar{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.strip{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory}
.daycard{flex:0 0 min(78%, 240px); scroll-snap-align:start; border-radius:var(--r-md); padding:14px; background:var(--surface); border:1px solid var(--line); text-align:left; display:grid; gap:6px}
.daycard .d{font:800 2.2rem/1 var(--f-display); color:var(--accent)}

/* days */
.daypills{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.daypills::-webkit-scrollbar{display:none}
.daypill{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:8px 12px; text-align:left; min-width:72px}
.daypill b{display:block; font:800 1.1rem/1.1 var(--f-display)}
.daypill small{color:var(--muted); font-weight:700; font-size:11.5px}
.daypill[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.daypill[aria-selected="true"] small{color:inherit; opacity:.85}
.dayhero{border-radius:var(--r-lg); padding:18px; background:var(--hero); color:var(--hero-ink); display:grid; gap:10px}
.dayhero h2{font-size:clamp(1.6rem, 6vw, 2.3rem)}
.dayhero p{margin:0; color:var(--hero-muted)}
.dayhero .chip{background:color-mix(in srgb, var(--hero-ink) 12%, transparent); color:var(--hero-ink)}
.day-layout{display:grid; gap:18px}
@media (min-width:860px){ .day-layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); align-items:start} }
.tl{list-style:none; margin:0; padding:0; display:grid}
.tl-item{display:grid; grid-template-columns:auto 76px minmax(0,1fr); gap:10px; padding:12px 0; border-bottom:1px dashed var(--line); align-items:start}
.tl-item:last-child{border-bottom:0}
.tick{width:26px; height:26px; border-radius:9px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0}
.tick svg{width:15px; height:15px; opacity:0}
.done .tick{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.done .tick svg{opacity:1}
.done .tl-body b{text-decoration:line-through; opacity:.6}
.tl-time{font:700 12.5px/1.3 var(--f-mono); color:var(--muted); padding-top:4px}
.tl-body{background:none; border:0; text-align:left; padding:0; display:grid; gap:3px; min-width:0}
.tl-body b{font-weight:700}
.tl-body p{margin:0; color:var(--muted); font-size:14px}
.who{font-size:11.5px; font-weight:800; color:var(--lagoon)}
.side{display:grid; gap:14px}
.mini{display:grid; gap:8px}
.mini-row{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 12px; border-radius:var(--r-sm); background:var(--surface-2); text-align:left; border:0; width:100%}
.mini-row span{min-width:0}

/* route */
.pass{display:grid; grid-template-columns:minmax(0,1fr) auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.pass-main{padding:16px; display:grid; gap:10px; min-width:0}
.codes{display:flex; align-items:center; gap:10px}
.code{font:800 clamp(1.8rem, 8vw, 2.5rem)/1 var(--f-display); letter-spacing:-.01em}
.codes .line{flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); position:relative; min-width:30px}
.codes .line svg{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:26px; height:26px; color:var(--pop); background:var(--surface); padding:2px}
.places-sub{display:flex; justify-content:space-between; gap:10px; font-weight:700; font-size:13px; color:var(--muted)}
.pass-stub{border-left:2px dashed var(--line); padding:16px; display:grid; align-content:center; gap:4px; text-align:center; min-width:96px; background:var(--surface-2); position:relative}
.pass-stub::before,.pass-stub::after{content:""; position:absolute; left:-10px; width:18px; height:18px; border-radius:50%; background:var(--bg)}
.pass-stub::before{top:-10px}.pass-stub::after{bottom:-10px}
.pass-stub b{font:800 1.4rem/1 var(--f-display)}
.pass-stub small{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}

/* places */
.pcard{border-radius:var(--r-lg); overflow:hidden; background:var(--surface); border:1px solid var(--line); text-align:left; padding:0; display:grid}
.cover{position:relative; aspect-ratio:16/10; max-width:100%; color:#fff; padding:14px; display:flex; flex-direction:column; justify-content:flex-end; background:var(--t-mountain); overflow:hidden}
.cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.cover.has-img::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 35%, rgba(0,0,0,.7))}
.cover > *{position:relative; z-index:1}
.cover h3{font-size:1.45rem; line-height:1.05; color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.25)}
.cover .area{font-size:13px; font-weight:700; opacity:.9}
.stamp{position:absolute; top:12px; right:12px; z-index:2; background:#fff; color:#0F231E; font:800 12px/1 var(--f-display); padding:7px 9px; border-radius:8px; transform:rotate(5deg); box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sticker{position:absolute; top:12px; left:12px; z-index:2; background:var(--sun); color:#1D1500; font:800 11.5px/1 var(--f-body); padding:6px 9px; border-radius:999px; transform:rotate(-4deg); text-transform:uppercase; letter-spacing:.04em}
.pbody{padding:12px 14px 14px; display:grid; gap:8px}
.pbody p{margin:0; color:var(--muted); font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.t-Mountains{background:var(--t-mountain)} .t-Trek{background:var(--t-trek)} .t-Beach{background:var(--t-beach)} .t-Temple{background:var(--t-temple)}
.t-Safari{background:var(--t-safari)} .t-Houseboat,.t-Backwaters{background:var(--t-house)} .t-Waterfall{background:linear-gradient(150deg,#4FC3E8,#14507A 80%)} .t-Infant-friendly{background:linear-gradient(150deg,#FFB86B,#C2512E 80%)} .t-Wildlife{background:var(--t-wild)} .t-Hidden-gem{background:var(--t-gem)}
.facts{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr))}
.fact{background:var(--surface-2); border-radius:var(--r-sm); padding:10px 12px}
.fact small{display:block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.shots{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.shots li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; align-items:start; background:var(--surface-2); padding:10px; border-radius:var(--r-sm)}
.shots svg{width:22px; height:22px; color:var(--hibiscus); margin-top:1px}
.gallery{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr))}
.gallery button{padding:0; border:0; border-radius:12px; overflow:hidden; aspect-ratio:1; max-width:100%; background:var(--surface-2)}
.gallery img{width:100%; height:100%; object-fit:cover}

/* stays */
.night{display:grid; gap:12px}
.night-head{display:grid; gap:6px}
.night-head .when{font:700 13px/1.2 var(--f-mono); color:var(--accent)}
.search-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.search-row::-webkit-scrollbar{display:none}
.plat{display:inline-flex; align-items:center; border-radius:8px; padding:4px 8px; font-size:12px; font-weight:800; color:#fff; background:#55625D; white-space:nowrap}
.plat-airbnb{background:#E0314F} .plat-booking-com{background:#003580} .plat-agoda{background:#2B6BE0} .plat-trip-com{background:#1F6FE5} .plat-makemytrip{background:#C9302C} .plat-goibibo{background:#E8531C} .plat-direct-website{background:#0E6F52}
.option{display:grid; gap:8px}
.option-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.option h3{font-size:1.05rem}
.price-line{font-weight:700}
.price-line .num{font-size:1.05rem}
.option.is-booked{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}

/* tickets */
.ticket{display:grid; grid-template-columns:minmax(0,1fr) auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; text-align:left; padding:0}
.ticket-main{padding:14px; display:grid; gap:6px; min-width:0}
.ticket-stub{border-left:2px dashed var(--line); padding:14px 12px; display:grid; align-content:center; justify-items:center; gap:2px; min-width:104px; position:relative; background:color-mix(in srgb, var(--sun) 14%, var(--surface))}
.ticket-stub::before,.ticket-stub::after{content:""; position:absolute; left:-9px; width:16px; height:16px; border-radius:50%; background:var(--bg)}
.ticket-stub::before{top:-9px}.ticket-stub::after{bottom:-9px}
.ticket-stub b{font:700 1.05rem/1.1 var(--f-mono)}
.ticket-stub small{font-size:11px; color:var(--muted); font-weight:700; text-align:center}
.bk{font-size:12px; font-weight:800}
.bk-online{color:var(--lagoon)} .bk-offline{color:var(--warn)} .bk-none{color:var(--muted)}
.day-label{font:800 13px/1 var(--f-body); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:6px 0 2px}

/* budget */
.total-card{background:var(--hero); color:var(--hero-ink); border-radius:var(--r-lg); padding:20px; display:grid; gap:14px}
.total-card .big{font:800 clamp(2.2rem, 9vw, 3.2rem)/1 var(--f-display)}
.total-card .sub{display:flex; flex-wrap:wrap; gap:8px}
.total-card .chip{background:color-mix(in srgb, var(--hero-ink) 12%, transparent); color:var(--hero-ink)}
.catbars{display:grid; gap:10px}
.catbar{display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:10px; align-items:center; font-weight:700; font-size:14px}
.catbar .bar{height:12px}
.cat-Transport i{background:var(--lagoon)} .cat-Stay i{background:var(--accent)} .cat-Food i{background:var(--pop)} .cat-Activities i{background:var(--sun)} .cat-Shopping i{background:var(--hibiscus)} .cat-Other i{background:var(--muted)}
.table-wrap{overflow-x:auto}
.rows{display:grid}
.row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:11px 2px; border-bottom:1px solid var(--line); text-align:left; background:none; border-left:0; border-right:0; border-top:0; width:100%}
.row:last-child{border-bottom:0}
.row .amt{font:700 14px var(--f-mono); text-align:right}
.row small{color:var(--muted); grid-column:1 / -1; font-size:12.5px}

/* must do */
.check{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line)}
.check .txt{background:none; border:0; text-align:left; padding:0; font-weight:700; min-width:0}
.check.done .txt{text-decoration:line-through; color:var(--muted)}
.check.done .tick{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.check.done .tick svg{opacity:1}
.ring{--p:0; width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0); display:grid; place-items:center; flex:none}
.ring span{width:48px; height:48px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font:700 13px var(--f-mono)}

/* FAB + sheet + toast */
.fab{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:25; height:56px; border-radius:18px; padding:0 20px 0 16px; background:var(--pop); color:#fff; border:0; font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; box-shadow:0 10px 26px color-mix(in srgb, var(--pop) 40%, transparent)}
.fab svg{width:22px; height:22px}
.sheet-wrap{position:fixed; inset:0; z-index:40; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:26px 26px 0 0; padding:8px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l); animation:up .22s ease-out}
@media (min-width:700px){ .sheet-wrap{align-items:center} .sheet{border-radius:26px; padding:8px 22px 22px} }
@keyframes up{from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
.grab{width:42px; height:5px; border-radius:9px; background:var(--line); margin:4px auto 10px}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; position:sticky; top:-8px; background:var(--bg); padding-block:8px; z-index:2}
.sheet-head h2{font-size:1.3rem}
.form{display:grid; gap:12px}
.field{display:grid; gap:5px}
.field label{font-size:12.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 12px; font-size:16px}
.field textarea{min-height:84px; resize:vertical}
.field .hint{font-size:12.5px; color:var(--muted)}
.two{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr))}
.multi{display:flex; flex-wrap:wrap; gap:6px}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-top:6px}
.actions .r{display:flex; gap:8px; margin-left:auto}
.toast{position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; font-size:14px; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{border-radius:var(--r-md); padding:14px 16px; background:color-mix(in srgb, var(--sun) 22%, var(--surface)); border:1px solid color-mix(in srgb, var(--sun) 50%, var(--line)); display:grid; gap:10px}
.banner p{margin:0}
.steps{margin:0; padding-left:20px; display:grid; gap:6px}
.copybox{display:flex; gap:8px}
.copybox input{flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface); font:500 13px var(--f-mono)}
.lightbox img{border-radius:16px; width:100%; max-height:70vh; object-fit:contain; background:var(--surface-2)}
/* split */
.xfer{display:grid; gap:12px}
.xfer.mine{border-color:var(--pop); box-shadow:0 0 0 2px color-mix(in srgb, var(--pop) 25%, transparent)}
.xfer-top{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center}
.xamt{font:800 1.35rem/1 var(--f-display); color:var(--pop)}
.av{width:40px; height:40px; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; font:800 14px/1 var(--f-display); flex:none; color:var(--accent)}
.who-cell{display:flex; gap:12px; align-items:center; min-width:0}
.who-cell > span:last-child{min-width:0}
.ico{width:40px; height:40px; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; font-size:20px; flex:none}
.exp-row,.bal-row{align-items:center}
.amt.pos{color:var(--ok)} .amt.neg{color:var(--bad)}
.total-card select{background:var(--surface); color:var(--ink)}
.typegrid{display:grid; gap:6px; grid-auto-flow:column; grid-template-rows:repeat(2, auto); grid-auto-columns:88px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.typebtn{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:8px 6px; display:grid; justify-items:center; gap:2px; font-size:12px; font-weight:700}
.typebtn span{font-size:22px; line-height:1.1}
.typebtn[aria-pressed="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent)}
.seg{display:grid; grid-template-columns:repeat(4, 1fr); background:var(--surface-2); border-radius:14px; padding:4px; gap:4px}
.seg button{border:0; background:none; border-radius:10px; padding:9px 4px; font-weight:800; font-size:13.5px}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.12)}
.split-head{display:flex; justify-content:space-between; align-items:center}
.split-rows{display:grid; gap:6px}
.split-row{display:grid; grid-template-columns:minmax(0,1fr) 76px 40px 84px; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 10px}
.split-row.off{opacity:.55}
.split-row .inc{display:flex; gap:8px; align-items:center; font-weight:700; min-width:0}
.split-row .inc span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.split-row .inc input{width:20px; height:20px; accent-color:var(--accent); flex:none}
.split-row .sv{width:100%; border:1px solid var(--line); border-radius:9px; padding:7px 8px; background:var(--bg); font-size:15px}
.split-row .unit{font-size:12px; color:var(--muted); font-weight:700}
.split-row .out{text-align:right; font-weight:700; font-size:13.5px}
#splitMsg.err{color:var(--bad); font-weight:700}
.qr{background:#fff; border-radius:18px; padding:12px; width:min(100%, 280px); margin:0 auto; aspect-ratio:1; display:grid; place-items:center}
.qr svg{width:100%; height:auto}
@media (max-width:420px){ .split-row{grid-template-columns:minmax(0,1fr) 64px 72px} .split-row .unit{display:none} }
/* ===== v3 look ===== */
:root{ --wa:#1FAF5A; --wa-ink:#FFFFFF; --glass:color-mix(in srgb, var(--surface) 72%, transparent); --shadow:0 1px 2px rgba(10,30,24,.06), 0 8px 24px rgba(10,30,24,.07) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wa:#25D366; --wa-ink:#04140D; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35) } }
:root[data-theme="dark"]{ --wa:#25D366; --wa-ink:#04140D; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35) }
body{background:radial-gradient(900px 500px at 100% -10%, color-mix(in srgb, var(--sun) 16%, transparent), transparent 60%), radial-gradient(800px 600px at -10% 20%, color-mix(in srgb, var(--lagoon) 12%, transparent), transparent 60%), var(--bg); background-attachment:fixed; padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.card,.pcard,.ticket,.pass,.stat{box-shadow:var(--shadow)}
.view > *{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.view > *:nth-child(2){animation-delay:.03s} .view > *:nth-child(3){animation-delay:.06s} .view > *:nth-child(4){animation-delay:.09s}
@keyframes rise{from{opacity:.001; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .view > *{animation:none} }
.bell{position:relative}
.bell-n{position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--pop); color:#fff; font:800 11px/19px var(--f-body); text-align:center}
.badge{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--pop); color:#fff; font-size:11px; margin-left:4px}
.bnav{position:fixed; left:0; right:0; bottom:0; z-index:24; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:6px max(10px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px)); background:var(--glass); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); border-top:1px solid var(--line)}
.bnav button{position:relative; border:0; background:none; display:grid; justify-items:center; gap:2px; padding:6px 0; border-radius:14px; font-size:11.5px; font-weight:700; color:var(--muted)}
.bnav svg{width:23px; height:23px}
.bnav button[aria-current="page"]{color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent)}
.ndot{position:absolute; top:5px; right:calc(50% - 16px); width:8px; height:8px; border-radius:50%; background:var(--pop)}
.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){ .bnav{display:none} .fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))} body{padding-bottom:96px} }
.hero.has-photo{background:#0B241D; min-height:300px; align-content:end}
.hero-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
.hero.has-photo::before{content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(180deg, rgba(4,20,15,.15) 0%, rgba(4,20,15,.35) 40%, rgba(4,20,15,.88) 100%)}
.hero > *{position:relative; z-index:1}
.hero-art{position:absolute !important; left:0; right:0; bottom:0; width:100%; height:62%; z-index:0 !important; pointer-events:none}
.hero.has-photo .hero-art{display:none}
.hero.has-photo::after{display:none}
.hero h1{font-size:clamp(2.3rem, 10vw, 4rem); letter-spacing:-.035em; text-shadow:0 2px 24px rgba(0,0,0,.25)}
.hero .count div{backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.credit{position:absolute !important; right:14px; bottom:10px; font-size:10.5px; color:rgba(255,255,255,.7)}
.hero:not(.has-photo) .credit{display:none}
.quick{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr))}
.qa{display:grid; gap:2px; text-align:left; padding:14px; border-radius:18px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow)}
.qa-ic{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); font-size:18px; margin-bottom:6px}
.qa:first-child .qa-ic{background:var(--wa); color:var(--wa-ink)}
.qa span:last-child{font-size:12.5px; color:var(--muted)}
.cover-art{position:absolute; right:0; bottom:0; width:70%; height:auto; z-index:0}
.wa-btn{background:var(--wa); border-color:var(--wa); color:var(--wa-ink)}
.wa-btn svg{width:16px; height:16px}
.wa-chip{background:color-mix(in srgb, var(--wa) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--wa) 45%, var(--line)); color:var(--ink); text-decoration:none; cursor:pointer}
.wa-chip svg{width:13px; height:13px; color:var(--wa)}
.like{cursor:pointer} .like.on{background:color-mix(in srgb, var(--hibiscus) 16%, var(--surface)); border-color:color-mix(in srgb, var(--hibiscus) 45%, var(--line))}
.star-chip{background:color-mix(in srgb, var(--sun) 26%, var(--surface))}
.stars{display:flex; gap:6px; justify-content:center}
.stars button{border:0; background:none; font-size:40px; line-height:1; color:var(--line); padding:4px; transition:transform .12s}
.stars button.on{color:var(--sun)} .stars button:active{transform:scale(1.2)}
.rsvp-going{background:color-mix(in srgb, var(--ok) 20%, var(--surface))} .rsvp-maybe,.rsvp-invited{background:color-mix(in srgb, var(--sun) 28%, var(--surface))} .rsvp-not-going{background:var(--surface-2); color:var(--muted)}
.person{align-items:center}
.person-btns{display:flex; gap:6px; align-items:center}
.mono-num{font:600 14px var(--f-mono); user-select:all}
.wa-hero{border-radius:var(--r-lg); padding:18px; display:grid; gap:12px; color:#fff; background:linear-gradient(135deg, #0E6B4A, #128C7E 55%, #1FAF5A); box-shadow:var(--shadow)}
.wa-hero h3{font-size:1.2rem; max-width:32ch}
.wa-hero .eyebrow{color:rgba(255,255,255,.75)}
.wa-hero .chip{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.3); cursor:pointer; font-size:13px; padding:7px 12px}
.feed-row{align-items:center}
.feed-row.unread{background:color-mix(in srgb, var(--pop) 8%, transparent); border-radius:12px; padding-inline:8px}
.poll{display:grid; gap:8px}
.poll-opt{position:relative; overflow:hidden; display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--surface); font-weight:700}
.poll-bar{position:absolute; inset:0 auto 0 0; background:color-mix(in srgb, var(--accent) 16%, transparent); transition:width .4s}
.poll-t,.poll-n{position:relative}
.poll-n{font-size:12.5px; color:var(--muted)}
.poll-opt.on{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}
.gal{display:grid; gap:6px; grid-template-columns:repeat(auto-fill, minmax(min(31%, 150px), 1fr))}
.gal-item{position:relative; padding:0; border:0; border-radius:14px; overflow:hidden; aspect-ratio:1; max-width:100%; background:var(--surface-2)}
.gal-item img{width:100%; height:100%; object-fit:cover; transition:transform .3s}
.gal-item:hover img{transform:scale(1.04)}
.gal-by{position:absolute; left:6px; bottom:6px; font-size:10.5px; font-weight:700; color:#fff; background:rgba(0,0,0,.45); padding:2px 7px; border-radius:99px}
.gal-empty{display:grid; justify-items:center; gap:6px; cursor:pointer; padding:34px 20px}
.gal-stage{position:relative}
.gal-nav{position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; border:0; background:rgba(0,0,0,.45); color:#fff; font-size:26px; line-height:1}
.gal-nav.prev{left:8px} .gal-nav.next{right:8px}
.gal-spin{position:absolute; top:12px; right:12px}
.toast.act{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 14px; width:min(560px, calc(100% - 32px))}
.toast.act span{flex:1; min-width:0; font-size:13.5px}
.toast.act .icon-btn{width:32px; height:32px; background:transparent; border-color:transparent; color:inherit}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){ .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))} }
/* attachments */
.att-list{display:grid; gap:8px}
.att{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px}
.att-thumb{width:52px; height:52px; border-radius:10px; border:0; padding:0; overflow:hidden; background:var(--surface-2); display:grid; place-items:center; font:800 12px var(--f-mono); color:var(--pop)}
.att-thumb img{width:100%; height:100%; object-fit:cover}
.att-meta{display:grid; min-width:0}

.att-btns{display:flex; gap:6px}
.att-chip{padding:2px 7px; font-size:11.5px}
.read-box{display:grid; gap:10px; border-radius:14px; padding:12px; background:color-mix(in srgb, var(--lagoon) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--lagoon) 40%, var(--line))}

.sugg{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px; align-items:center; font-size:13px; font-weight:700; color:var(--muted)}

.viewer-box{background:var(--bg); border-radius:22px; padding:14px; width:min(100%, 720px); max-height:92vh; overflow:auto; display:grid; gap:12px}

.pdf-box{display:grid; place-items:center; gap:8px; padding:30px; border-radius:14px; background:var(--surface-2)}
.pdf-icon{font:800 1.6rem var(--f-display); color:var(--pop); border:3px solid var(--pop); border-radius:12px; padding:10px 14px}

code{font-family:var(--f-mono); font-size:.9em; background:var(--surface-2); padding:1px 5px; border-radius:6px}

function tickCountdown() {
  const el = $('#countdown'); if (!el) return;
  const m = meta(); const t = m.start ? new Date(m.start).getTime() : NaN;
  if (isNaN(t)) { el.innerHTML = ''; return; }
  let ms = t - Date.now();
  if (ms <= 0) { el.innerHTML = `<div><b>Live</b><span>we’re on the road</span></div>`; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, mi = Math.floor(ms / 6e4) % 60;
  el.innerHTML = `<div><b>${d}</b><span>days</span></div><div><b>${h}</b><span>hours</span></div><div><b>${mi}</b><span>mins</span></div>`;
}

/* Places */
function placeCover(p, big) {
  const tag = (p.tags || []).find(t => !/must visit|adventure|infant/i.test(t)) || (p.tags || [])[0] || 'Mountains';
  const photo = DB.photos.find(x => x.placeId === p.id);
  const own = photo ? imgSrc(photo.src) : imgSrc(String(p.images || '').split(/\s+/).find(Boolean));
  const stockKey = (p.tags || []).includes('Houseboat') ? 'Houseboat' : (p.tags || []).includes('Backwaters') ? 'Backwaters' : (p.tags || []).includes('Beach') ? 'Beach' : (tag === 'Mountains' ? 'Mountains' : '');
  const firstImg = own || (stockKey ? UNS(STOCK[stockKey][0], big ? 1400 : 800) : '');
  const special = (p.tags || []).includes('Must visit') ? 'Must visit' : (p.tags || []).includes('Hidden gem') ? 'Hidden gem' : '';
  return `<div class="cover t-${slug(tag).replace(/^./, c => c.toUpperCase())} ${firstImg ? 'has-img' : ''}" ${big ? 'style="aspect-ratio:16/9;border-radius:18px"' : ''}>
    ${firstImg ? `<img src="${esc(firstImg)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : coverArt(tag)}
    ${special ? `<span class="sticker">${special}</span>` : ''}${p.dayNo ? `<span class="stamp">DAY ${esc(p.dayNo)}</span>` : ''}
    <h3>${esc(p.name)}</h3><span class="area">${esc(p.area)}</span></div>`;
}

    ['Airbnb', `https://www.airbnb.co.in/s/${air}/homes?checkin=${ci}&checkout=${co}&adults=${ad}&children=${+m.kids || 0}&infants=${+m.infants || 0}`],
    ['Booking.com', `https://www.booking.com/searchresults.html?ss=${q}&checkin=${ci}&checkout=${co}&group_adults=${ad}&no_rooms=5`],
    ['Agoda', `https://www.agoda.com/search?textToSearch=${q}&checkIn=${ci}&checkOut=${co}&adults=${ad}&rooms=5`],

}

/* Activities */
function vActs() {

  return out;
}
function balances() {

  DB.expenses.forEach(x => { if (x.paidBy in b) b[x.paidBy] += expTotal(x); const s = expShares(x); for (const k in s) if (k in b) b[k] -= s[k]; });

function settleUp(b) {

  for (const k in b) { const v = Math.round(b[k] * 100) / 100; if (v > 0.5) cr.push([k, v]); else if (v < -0.5) dr.push([k, -v]); }
  cr.sort((x, y) => y[1] - x[1]); dr.sort((x, y) => y[1] - x[1]);
  const out = []; let i = 0, j = 0;
  while (i < dr.length && j < cr.length) {
    const amt = Math.min(dr[i][1], cr[j][1]);
    if (Math.round(amt) > 0) out.push({ from: dr[i][0], to: cr[j][0], amount: Math.round(amt) });
    dr[i][1] -= amt; cr[j][1] -= amt; if (dr[i][1] < 0.5) i++; if (cr[j][1] < 0.5) j++;

}

function recalcSplit() {

function compress(file, max = 1280, limit = 700000, q0 = .8) {
  return new Promise((ok, no) => {
    const r = new FileReader(); r.onerror = no;
    r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {
      let { width: w, height: h } = im; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
      let q = q0, out = cv.toDataURL('image/jpeg', q); while (out.length > limit && q > .35) { q -= .1; out = cv.toDataURL('image/jpeg', q); }
      ok(out); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

const CHUNK = 900000;
const filesFor = (c, id) => id ? DB.files.filter(f => f.parentC === c && f.parentId === id).sort((a, b) => (a._at || 0) - (b._at || 0)) : [];

const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const readDataURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const dataURLtoBlob = u => { const [h, b] = u.split(','); const mime = (/data:([^;]+)/.exec(h) || [])[1] || 'application/octet-stream'; const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); };
const isPdf = t => /pdf/i.test(t || '');
const blobCache = {};
async function saveAttachment(parentC, parentId, file, text, o) {
  o = o || {}; let data, type = file.type || '', thumb = '';
  if (/^image\//.test(type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)) { data = await compress(file, o.max || 1600, o.limit || CHUNK, o.q || .8); thumb = await compress(file, o.thumb || 180, o.thumbLimit || 12000, .7); type = 'image/jpeg'; }
  else if (isPdf(type) || /\.pdf$/i.test(file.name)) { if (file.size > 8e6) throw new Error(file.name + ' is over 8 MB'); data = await readDataURL(file); type = 'application/pdf'; }
  else throw new Error(file.name + ' isn’t an image or PDF');
  const fid = uid(); const parts = [];
  for (let i = 0; i < data.length; i += CHUNK) parts.push(data.slice(i, i + CHUNK));
  for (let i = 0; i < parts.length; i++) await B.add('blobs', { fileId: fid, i, d: parts[i] }, fid + '_' + i);
  blobCache[fid] = data;
  await B.add('files', { parentC, parentId, name: file.name, type, size: file.size, stored: Math.round(data.length * .75), n: parts.length, thumb, text: (text || '').slice(0, 4000) }, fid);
}
async function loadAttachment(f) {
  if (blobCache[f.id]) return blobCache[f.id];
  const parts = [];
  for (let i = 0; i < (+f.n || 1); i++) { const b = await B.get('blobs', f.id + '_' + i); if (!b) throw new Error('File data is missing'); parts.push(b.d); }
  return (blobCache[f.id] = parts.join(''));
}
function deleteAttachment(f) { for (let i = 0; i < (+f.n || 1); i++) run(B.remove('blobs', f.id + '_' + i)); run(B.remove('files', f.id)); delete blobCache[f.id]; }

/* text extraction: PDF text layer first, OCR for images and scanned PDFs */
let pdfLib = null, ocrLib = null;
async function getPdfLib() {
  if (pdfLib) return pdfLib;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return (pdfLib = window.pdfjsLib);
}
async function ocr(src, prog) {
  if (!ocrLib) { await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'); ocrLib = window.Tesseract; }
  const w = await ocrLib.createWorker('eng', 1, { logger: m => { if (m.status === 'recognizing text') prog('Reading text… ' + Math.round(m.progress * 100) + '%'); else if (/load/i.test(m.status)) prog('Getting the text reader ready (first time takes a moment)…'); } });
  try { const r = await w.recognize(src); return r.data.text || ''; } finally { w.terminate(); }
}
async function extractText(blob, type, prog) {
  if (isPdf(type)) {
    prog('Opening PDF…');
    const lib = await getPdfLib(); const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    const lines = [];
    for (let p = 1; p <= Math.min(pdf.numPages, 4); p++) {
      const tc = await (await pdf.getPage(p)).getTextContent(); let last = null, line = [];
      tc.items.forEach(it => { const y = Math.round(it.transform[5]); if (last !== null && Math.abs(y - last) > 3) { lines.push(line.join(' ')); line = []; } if (it.str.trim()) line.push(it.str.trim()); last = y; });
      lines.push(line.join(' '));
    }
    const text = lines.filter(Boolean).join('\n');
    if (text.replace(/\s/g, '').length > 40) return text;
    prog('This PDF is a scan – reading it as an image…');
    const page = await pdf.getPage(1); const vp = page.getViewport({ scale: 2.2 });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    return ocr(cv, prog);
  }
  const url = URL.createObjectURL(blob);
  try { return await ocr(url, prog); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
}

/* receipt parser: best-effort guesses that the person reviews before filling */
const MONS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const pad2 = n => String(n).padStart(2, '0');
function findDates(t) {
  const out = []; const tripYear = (meta().start || '2027').slice(0, 4);
  const push = (y, m, d, idx, len) => { y = +String(y).replace(/\D/g, ''); if (y < 100) y += 2000; m = +m; d = +d; if (m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 2020 && y <= 2035) out.push({ iso: `${y}-${pad2(m)}-${pad2(d)}`, idx, len }); };
  for (const m of t.matchAll(/\b(20\d\d)[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g)) push(m[1], m[2], m[3], m.index, m[0].length);
  for (const m of t.matchAll(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d\d|\d\d)\b/g)) push(m[3], m[2], m[1], m.index, m[0].length);

/* ---------- plan update (v1 → v2) ---------- */
const PLAN_COLLS = ['days','timeline','legs','places','stays','activities','budget','mustdo','photographers'];
function keepOnUpdate(c, x) {
  if (oldPlanItem(x)) return false;
  if (filesFor(c, x.id).length) return true;
  if ((c === 'stays' || c === 'activities') && (x.status === 'Booked' || x.status === 'Paid')) return true;
  if (c === 'budget' && (x.status === 'Paid' || x.status === 'Quoted')) return true;
  if (c === 'photographers' && x.status && x.status !== 'Shortlist') return true;
  if (c === 'mustdo' && x.done) return true;
  return false;
}
function planDiff() {
  const kept = {}, drop = {};
  PLAN_COLLS.forEach(c => { kept[c] = DB[c].filter(x => keepOnUpdate(c, x)); drop[c] = DB[c].filter(x => !keepOnUpdate(c, x)); });
  return { kept, drop };
}
async function runPool(tasks, n) { for (let i = 0; i < tasks.length; i += n) await Promise.all(tasks.slice(i, i + n).map(f => f().catch(() => {}))); }
async function applyNewPlan() {
  const fresh = seed(); const { kept, drop } = planDiff(); const oldV = +meta().planVersion || 1;
  try { const snap = {}; PLAN_COLLS.concat(['meta', 'contacts']).forEach(c => snap[c] = DB[c]); ls.set('ktrip.planBackup.v' + oldV, snap); } catch (e) {}
  const same = (a, b) => slug(a) === slug(b);
  const tasks = [];
  PLAN_COLLS.forEach(c => {
    drop[c].forEach(x => tasks.push(() => B.remove(c, x.id)));
    // items kept from the old plan move one day later (the new plan starts a day earlier)
    if (oldV < 2) kept[c].forEach(x => { if (x.dayNo && c !== 'days') tasks.push(() => B.update(c, x.id, { dayNo: +x.dayNo + 1 })); });
    const keyOf = x => x.name || x.text || x.item || x.title || '';
    fresh[c].filter(n => !kept[c].some(k => same(keyOf(k), keyOf(n)) && (c !== 'stays' || k.stop === n.stop))).forEach(n => { const o = Object.assign({}, n); delete o.id; tasks.push(() => B.add(c, o)); });
  });
  const haveNums = new Set(DB.contacts.map(x => waNum(x.phone)));
  fresh.contacts.filter(x => !haveNums.has(waNum(x.phone))).forEach(x => { const o = Object.assign({}, x); delete o.id; tasks.push(() => B.add('contacts', o)); });
  const fm = fresh.meta[0];
  tasks.unshift(() => B.update('meta', 'trip', { start: fm.start, planVersion: PLAN_V }));
  toast('Updating the plan…');
  await runPool(tasks, 6);
  S.day = 1; ls.set(KEYS.day, 1);
  announce('note', 'updated the trip to the new plan: noon start, Dindigul night, shikara (no houseboat), Athirappilly Falls 🌊', 'days');
}

  if (S.applying || !S.ready || !DB.days.length || (+meta().planVersion || 1) >= PLAN_V) return '';
  const { kept } = planDiff(); const nk = PLAN_COLLS.reduce((t, c) => t + kept[c].length, 0);
  return `<div class="banner plan-banner"><p><b>✨ New plan ready – 25 Jan, 12 pm start.</b> Night at Dindigul (no ghat driving in the dark), Munnar lakes & Top Station, Periyar + Yodha Kalari + jeep safari, Kumarakom shikara instead of the houseboat, Athirappilly Falls, Guruvayur. Easy walks only.</p>

function tambolaTicket(seedStr) {
  const rnd = mulberry(hashStr(seedStr));
  for (let tries = 0; tries < 500; tries++) {
    const counts = Array(9).fill(1); let extra = 6;
    while (extra) { const c = Math.floor(rnd() * 9); if (counts[c] < 3) { counts[c]++; extra--; } }
    const grid = [[], [], []].map(() => Array(9).fill(0)); const rows = [0, 0, 0];
    let ok = true;
    for (let c = 0; c < 9 && ok; c++) {
      const order = [0, 1, 2].sort((a, b) => rows[a] - rows[b] || rnd() - .5).slice(0, counts[c]);
      order.forEach(r => { grid[r][c] = 1; rows[r]++; }); if (rows.some(x => x > 5)) ok = false;
    }
    if (!ok || rows.some(x => x !== 5)) continue;
    for (let c = 0; c < 9; c++) {
      const lo = c === 0 ? 1 : c * 10, hi = c === 8 ? 90 : c * 10 + 9; const pool = []; for (let n = lo; n <= hi; n++) pool.push(n);
      const picks = shuffle(pool, rnd).slice(0, counts[c]).sort((a, b) => a - b); let k = 0;
      for (let r = 0; r < 3; r++) if (grid[r][c]) grid[r][c] = picks[k++];
    }
    return grid;
  }
  return null;
}

function tambolaCheck(prize, grid, called) {
  const has = n => called.includes(n); const nums = r => grid[r].filter(Boolean);
  if (prize === 'early5') return grid.flat().filter(n => n && has(n)).length >= 5;
  if (prize === 'full') return grid.flat().filter(Boolean).every(has);
  return nums({ top: 0, mid: 1, bot: 2 }[prize]).every(has);
}

/* ---------- weather (Open-Meteo, free, no key) ---------- */
const LL = { kadapa: [14.4673, 78.8242], dindigul: [10.3624, 77.9695], munnar: [10.0889, 77.0595], thekkady: [9.6031, 77.1615], kumily: [9.607, 77.17], kumarakom: [9.6175, 76.4301], alleppey: [9.4981, 76.3388], alappuzha: [9.4981, 76.3388], athirappilly: [10.2851, 76.5698], guruvayur: [10.5943, 76.0411], marari: [9.6, 76.298], kochi: [9.9312, 76.2673], thrissur: [10.5276, 76.2144], salem: [11.6643, 78.146], coimbatore: [11.0168, 76.9558] };
const dayPlace = d => { if (!d) return ''; const n = d.night && !/home/i.test(d.night) ? d.night : (d.route || '').split('→').pop(); return String(n).replace(/local/i, '').trim(); };
const llFor = name => { const k = Object.keys(LL).find(x => slug(name).includes(x)); return k ? LL[k] : null; };
const WX = {};
const WXI = c => c == null ? '🌡️' : c === 0 ? '☀️' : c <= 3 ? '⛅' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : '⛈️';
async function loadWx(d) {
  const place = dayPlace(d); const ll = llFor(place); if (!ll || !d.date) return null;
  const key = d.date + '|' + place; if (WX[key]) return WX[key];
  WX[key] = { loading: true, place };
  const diff = Math.round((pd(d.date) - pd(today())) / 864e5);
  try {
    let r, kind;
    if (diff >= 0 && diff <= 15) {
      kind = 'forecast';
      r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ll[0]}&longitude=${ll[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Asia%2FKolkata&start_date=${d.date}&end_date=${d.date}`).then(x => x.json());
    } else {

      r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${ll[0]}&longitude=${ll[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&timezone=Asia%2FKolkata&start_date=${ds}&end_date=${ds}`).then(x => x.json());
    }
    const dl = r && r.daily; if (!dl || !dl.time) throw new Error('no data');
    WX[key] = { place, kind, max: Math.round(dl.temperature_2m_max[0]), min: Math.round(dl.temperature_2m_min[0]), rainP: dl.precipitation_probability_max ? dl.precipitation_probability_max[0] : null, rainMm: dl.precipitation_sum ? dl.precipitation_sum[0] : null, code: (dl.weather_code || [null])[0] };
  } catch (e) { WX[key] = { place, err: true }; }
  schedule(); return WX[key];
}
function wxText(w) {

  const rain = w.kind === 'forecast' ? (w.rainP != null ? ` · rain ${w.rainP}%` : '') : (w.rainMm != null ? ` · ${w.rainMm > 1 ? 'some rain' : 'dry'}` : '');

}

function startLoc() {
  if (!('geolocation' in navigator)) { toast('This phone can’t share location'); return; }
  if (needName()) return;
  let last = 0;
  S.locWatch = navigator.geolocation.watchPosition(p => {
    S.myLoc = [p.coords.latitude, p.coords.longitude];
    if (Date.now() - last < 30000) return; last = Date.now();
    run(B.add('kit', { type: 'loc', by: S.name, lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy || 0), at: Date.now() }, 'loc__' + slug(S.name)));
  }, e => { toast(e.code === 1 ? 'Location permission was denied' : 'Couldn’t get location'); stopLoc(); }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
  toast('Sharing your location with the group'); render();
}
function stopLoc() { if (S.locWatch != null) { try { navigator.geolocation.clearWatch(S.locWatch); } catch (e) {} } S.locWatch = null; if (S.name && DB.kit.some(x => x.id === 'loc__' + slug(S.name))) run(B.remove('kit', 'loc__' + slug(S.name))); render(); }
function sosShare() {
  const send = ll => { const t = `🆘 Need help!${S.name ? ' – ' + S.name : ''}\n` + (ll ? `My location: https://maps.google.com/?q=${ll[0]},${ll[1]}` : 'Couldn’t get GPS – call me.'); window.open(shareWA(t), '_blank', 'noopener'); };
  if (!('geolocation' in navigator)) return send(null);
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(p => send([p.coords.latitude.toFixed(5), p.coords.longitude.toFixed(5)]), () => send(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

/* ---------- 8 · budget vs actual ---------- */
const EXP_CAT = { Fuel: 'Transport', Tolls: 'Transport', Vehicle: 'Transport', Stay: 'Stay', Houseboat: 'Stay', Food: 'Food', 'Snacks & tea': 'Food', Tickets: 'Activities', Activities: 'Activities', 'Boat ride': 'Activities', Temple: 'Activities', Shopping: 'Shopping', Photographer: 'Other', Tips: 'Other', Medical: 'Other', Other: 'Other' };
function budgetVsActual() {
  const plan = {}, act = {};
  DB.budget.forEach(b => { const c = b.category || 'Other'; plan[c] = (plan[c] || 0) + (+b.amount || 0); });
  DB.expenses.forEach(x => { const c = EXP_CAT[x.type] || 'Other'; act[c] = (act[c] || 0) + expTotal(x); });
  const cats = OPT.budgetCat.filter(c => plan[c] || act[c]); const max = Math.max(1, ...cats.map(c => Math.max(plan[c] || 0, act[c] || 0)));
  const tp = cats.reduce((t, c) => t + (plan[c] || 0), 0), ta = cats.reduce((t, c) => t + (act[c] || 0), 0);
  return `<section class="card bva"><div class="sec-head"><h3>Budget vs actual</h3><span class="by">Actual = expenses logged in Split & settle</span></div>
    <div class="bva-legend"><span><i class="lg-p"></i>Planned</span><span><i class="lg-a"></i>Spent</span></div>
    ${cats.map(c => { const p = plan[c] || 0, a = act[c] || 0; const over = a > p && p > 0; return `<div class="bva-row"><span class="bva-k">${esc(c)}</span><div class="bva-bars"><span class="bp" style="width:${p / max * 100}%"></span><span class="ba ${over ? 'over' : ''}" style="width:${a / max * 100}%"></span></div><span class="bva-v num">${inr(a)}<small>/ ${inr(p)}</small></span></div>`; }).join('')}
    <p class="by" style="margin:6px 0 0">${ta ? `Spent ${inr(ta)} of ${inr(tp)} planned (${Math.round(ta / Math.max(1, tp) * 100)}%).` : 'Nothing spent yet – bars fill up as expenses are logged.'} ${cats.filter(c => (act[c] || 0) > (plan[c] || 0) && plan[c]).length ? '🔴 Over budget: ' + cats.filter(c => (act[c] || 0) > (plan[c] || 0) && plan[c]).join(', ') : ''}</p></section>`;
}

const OLD_PLAN_RE = /houseboat|kolukkumalai|lakshmi hills|chokramudi|bamboo raft|nature walk|\btrek\b/i;

function ensureCleanup() {
  if (cleanTried || !S.ready || S.err) return;
  if (B === Cloud && (!Cloud.serverOk || Cloud.loaded.size < COLLS.length)) return;
  if (B === Rest && !Rest.synced) return;
  const m = DB.meta.find(x => x.id === 'trip'); if (!m) return;

  let n = 0;
  ['stays', 'activities', 'places', 'timeline', 'budget', 'mustdo'].forEach(c => DB[c].filter(oldPlanItem).forEach(x => { filesFor(c, x.id).forEach(deleteAttachment); run(B.remove(c, x.id)); n++; }));
  kitOf('food').filter(x => /omelet|omelette|\begg\b/i.test(x.name) && x.veg !== 'Egg').forEach(x => run(B.update('kit', x.id, { veg: 'Egg' })));

    case 'chatStay': { const x = DB.stays.find(y => y.id === t.dataset.id); if (!x) break; openComposer('WhatsApp the host', x.phone, templates(/houseboat|shikara/i.test(x.stop + x.name) ? 'Boat / Shikara' : 'Stay host', x), x.name); break; }
    case 'chatAct': { const x = DB.activities.find(y => y.id === t.dataset.id); if (!x) break; const d = dayOf(x.dayNo) || {}; openComposer('WhatsApp about ' + x.name, x.phone, templates('Activity / Tickets', { name: x.name, qty: x.qty, date: d.date })); break; }
    case 'chatPhotog': { const x = DB.photographers.find(y => y.id === t.dataset.id); if (!x) break; const ph = (String(x.contact).match(/\+?\d[\d\s-]{8,}\d/) || [''])[0]; openComposer('WhatsApp ' + x.name, ph, templates('Photographer', { where: x.base })); break; }
    case 'like': { if (needName()) break; const tg = t.dataset.t, id = vid('like', tg, S.name); if (DB.votes.some(v => v.id === id)) run(B.remove('votes', id)); else run(B.add('votes', { kind: 'like', target: tg, by: S.name }, id)); break; }
    case 'rate': openRate(t.dataset.t, t.dataset.l); break;
    case 'star': { composer.stars = +t.dataset.n; document.querySelectorAll('.stars button').forEach(b => { b.classList.toggle('on', +b.dataset.n <= composer.stars); b.setAttribute('aria-checked', +b.dataset.n === composer.stars); }); break; }
    case 'saveRate': { if (!composer.stars) { toast('Tap a star first'); break; } const tg = t.dataset.t; run(B.add('votes', { kind: 'rate', target: tg, by: S.name, stars: composer.stars, note: $('#rateNote').value.trim() }, vid('rate', tg, S.name))); closeSheet(); logActivity('rate', `rated ${t.dataset.l} ${'★'.repeat(composer.stars)}`, S.tab); toast('Thanks for rating'); break; }
    case 'unrate': run(B.remove('votes', vid('rate', composer.rateT, S.name))); closeSheet(); break;
    case 'pollVote': { if (needName()) break; const tg = 'poll:' + t.dataset.id, id = vid('poll', tg, S.name); const cur = DB.votes.find(v => v.id === id); if (cur && +cur.opt === +t.dataset.i) run(B.remove('votes', id)); else run(B.add('votes', { kind: 'poll', target: tg, by: S.name, opt: +t.dataset.i }, id)); break; }
    case 'galf': S.galDay = t.dataset.k; render(); break;
    case 'galView': viewGallery(t.dataset.id); break;
    case 'galCapSave': run(B.update('files', t.dataset.id, { caption: $('#galCap').value.trim() })); toast('Caption saved'); break;
    case 'galDel': { if (armed !== t) { armed = t; t.classList.add('armed'); t.textContent = 'Tap again to delete'; break; } armed = null; const f = DB.files.find(x => x.id === t.dataset.id); if (f) deleteAttachment(f); $('#viewerRoot').innerHTML = ''; toast('Photo deleted'); break; }
    case 'galShare': { const g = S.galShare; if (!g) break; navigator.share({ files: [g.file], title: g.text, text: g.text }).catch(() => {}); break; }
    case 'notifyOn': if ('Notification' in window) Notification.requestPermission().then(p => { toast(p === 'granted' ? 'Alerts are on for this phone' : 'Alerts not allowed'); render(); }); break;
    case 'seedEmergency': EMERGENCY.forEach(([name, phone, linkedTo]) => run(B.add('contacts', { name, role: name.includes('eco') ? 'Activity / Tickets' : 'Emergency', phone, linkedTo, dayNo: '', notes: '' }))); toast('Emergency numbers added'); break;
    case 'theme': { const k = t.dataset.k; if (k) document.documentElement.setAttribute('data-theme', k); else document.documentElement.removeAttribute('data-theme'); ls.set('ktrip.theme', k); break; }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'cmpText' || e.target.id === 'cmpTo') updComposer(); });
document.addEventListener('input', e => { if (e.target.closest('#expForm')) { if (e.target.id === 'e_amt' || e.target.id === 'e_tip') { if (curMode() === 'exact') resetSplitVals(); } recalcSplit(); } });
document.addEventListener('submit', e => {
  if (e.target.id === 'expForm') { e.preventDefault(); saveExpense(); return; }
  if (e.target.id !== 'theForm') return; e.preventDefault();
  const { c } = editing; const id = editing.id; const data = readForm(); const newId = id || (c === 'meta' ? 'trip' : KIT_FIXED[c] || uid());
  const prev = id ? (DB[collOf(c)] || []).find(x => x.id === id) || {} : {};
  if (c.startsWith('kit:')) data.type = c.slice(4);
  if (c === 'meta') { run(B.update('meta', 'trip', data)); }
  else if (id) run(B.update(collOf(c), id, data));
  else { if (['timeline', 'mustdo', 'kit:pack', 'kit:food', 'kit:karaoke'].includes(c)) data.done = false; run(B.add(collOf(c), data, newId)); }
  if (c === 'kit:journal' && !id) logActivity('note', `added a memory from Day ${data.dayNo || '?'} 📖`, 'memories');
  if (c === 'kit:karaoke' && !id) logActivity('note', `queued “${data.song}” for karaoke 🎤`, 'fun');
  const ed = editing; closeSheet(); toast('Saved');
  setTimeout(() => {
    const st = data.status, was = prev.status, changed = st && st !== was;
    if (c === 'stays' && changed && (st === 'Booked' || st === 'Paid')) announce(st === 'Paid' ? 'pay' : 'book', `${st === 'Paid' ? 'paid for' : 'booked'} ${data.name} – ${data.stop} (${fmtD(data.checkin)} → ${fmtD(data.checkout)})${+data.price ? ', ' + inr(data.price * Math.max(1, nightsBetween(data.checkin, data.checkout))) : ''}`, 'stays');
    else if (c === 'activities' && changed && (st === 'Booked' || st === 'Paid')) announce(st === 'Paid' ? 'pay' : 'book', `${st === 'Paid' ? 'paid for' : 'booked'} ${data.name}${actTotal(data) ? ' – ' + inr(actTotal(data)) : ''}${data.dayNo ? ' (Day ' + data.dayNo + ')' : ''}`, 'activities');
    else if (c === 'budget' && changed && st === 'Paid') announce('pay', `paid ${inr(data.amount)} for ${data.item}`, 'budget');
    else if (c === 'photographers' && changed && st === 'Booked') announce('book', `booked photographer ${data.name}`, 'photo');
    else if (c === 'settlements' && !id) announce('settle', `${mName(data.from)} paid ${mName(data.to)} ${inr(data.amount)} ✅`, 'split');
    else if (c === 'polls' && !id) announce('poll', `asked: ${data.q}`, 'updates');
    else if (c === 'members' && data.rsvp && data.rsvp !== (prev.rsvp || '') && id) logActivity('rsvp', `${data.name} is ${data.rsvp === 'Going' ? 'in! 🎉' : data.rsvp.toLowerCase()}`, 'people');
  }, 50);
  if (ATTACH.has(c) && ed.pending && ed.pending.length) { editing = ed; uploadPending(c, newId).finally(() => { if (editing === ed) editing = null; }); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'upl') uploadPhotos(e.target);
  if (e.target.id === 'attInput') addPendingFiles(e.target);
  if (e.target.id === 'meSel') { S.me = e.target.value; ls.set('ktrip.me', S.me); render(); }
  if (e.target.id === 'galInput') uploadGallery(e.target);
  if (e.target.id === 'galDay') S.galUpDay = e.target.value;
  if (e.target.closest && e.target.closest('#expForm .inc')) { resetSplitVals(); recalcSplit(); }
  if (e.target.id === 'importFile' && e.target.files[0]) importFile(e.target.files[0]);
});
document.addEventListener('toggle', e => { const d = e.target; if (!d.matches || !d.matches('details.rules')) return; const i = +d.dataset.rule; S.openRules = (S.openRules || []).filter(x => x !== i).concat(d.open ? [i] : []); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#viewerRoot').innerHTML) $('#viewerRoot').innerHTML = ''; else closeSheet(); } });
$('#settingsBtn').addEventListener('click', openSettings);
$('#fab').addEventListener('click', () => {
  if (S.tab === 'gallery') { $('#galInput').click(); return; }
  const f = FAB[S.tab] || FAB.home; const def = {};
  if (f[0] === 'timeline') def.dayNo = S.tab === 'days' ? S.day : '';
  if (f[0] === 'mustdo') def.category = S.mustFilter !== 'All' ? S.mustFilter : 'Do';
  if (f[0] === 'places' && S.placeFilter !== 'All') def.tags = [S.placeFilter];
  openForm(f[0], null, def);
});
addEventListener('online', () => { S.online = true; renderSync(); });
addEventListener('offline', () => { S.online = false; renderSync(); });

/* ---------- boot ---------- */
(function boot() {
  const th = ls.get('ktrip.theme', ''); if (th) document.documentElement.setAttribute('data-theme', th);
  if (location.hash.startsWith('#join=')) {
    try { const cfg = JSON.parse(b64d(location.hash.slice(6))); if (cfg && cfg.fb && cfg.trip) ls.set(KEYS.cfg, cfg); } catch (e) { toast('That invite link is broken – ask for a fresh one.'); }
    history.replaceState(null, '', location.pathname + location.search);
  }
  const h = location.hash.slice(1); if (TABS.some(([k]) => k === h)) { S.tab = h; ls.set(KEYS.tab, h); }
  addEventListener('hashchange', () => { const k = location.hash.slice(1); if (TABS.some(([x]) => x === k) && k !== S.tab) setTab(k, true); });
  const cfg = ls.get(KEYS.cfg, null) || (ls.get('ktrip.localOnly', false) ? null : BUILTIN);
  if (cfg && cfg.fb && cfg.trip) {
    if (!ls.get(KEYS.cfg, null)) ls.set(KEYS.cfg, cfg);
    if (ls.get('ktrip.rest', false)) { Rest.init(cfg); B = Rest; Rest.start(); }
    else {
      B = Cloud; render();
      const timer = setTimeout(() => { if (!Cloud.serverOk) fallbackToRest(cfg); }, 7000);
      Cloud.start(cfg).catch(() => { clearTimeout(timer); fallbackToRest(cfg); });
    }
  } else { B = Local; Local.start(); }
  registerSW();
  if (!S.name && !ls.get(KEYS.welcomed, false)) {
    setTimeout(() => { ls.set(KEYS.welcomed, true); openSheet('Hey, who’s planning?', `<p style="margin:0">Add your name so the group can see who added or changed what. You can skip this.</p><div class="field"><label for="myName">Your name</label><input id="myName" placeholder="e.g. Ayen"></div><div class="actions"><button class="btn" data-act="closeSheet">Skip</button><div class="r"><button class="btn primary" data-act="saveName">Let’s go</button></div></div>`); }, 500);
  }
})();
document.addEventListener('click', e => { if (e.target.closest('[data-act="saveName"]') && $('#sheetRoot .sheet[aria-label^="Hey"]')) closeSheet(); });
})();
</script>
</body>
</html>
